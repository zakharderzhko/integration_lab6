global:
  scrape_interval: 5s
  evaluation_interval: 5s

rule_files:
  - alerts.yml

scrape_configs:
  - job_name: orders-api
    static_configs:
      - targets: ["orders-api:8000"]

  - job_name: forecast-api
    static_configs:
      - targets: ["forecast-api:8001"]

  - job_name: kb-api
    static_configs:
      - targets: ["kb-api:8002"]
